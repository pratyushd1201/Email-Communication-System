apiVersion: apps/v1
kind: Deployment
metadata:
  name: postmark-api
  namespace: postmark
spec:
  replicas: 2
  selector:
    matchLabels:
      app: postmark-api
  template:
    metadata:
      labels:
        app: postmark-api
    spec:
      containers:
        - name: postmark-api
          image: "<AWS_ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/postmark-api:latest"
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /simple-cors
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /simple-cors
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10